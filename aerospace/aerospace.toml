#Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Mouse follows focus when focused window changes
# Disabled: re-centering the cursor on every keyboard focus change is jarring.
# Record focus history so cmd-` can jump back to the previously focused window
# (across workspaces). See scripts/track-focus.sh + scripts/focus-prev.sh.
on-focus-changed = ['exec-and-forget ~/.config/aerospace/scripts/track-focus.sh']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED=$AEROSPACE_FOCUSED_WORKSPACE'
]
# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        [{ monitor."dell" = 44}, {monitor.built-in = 12}, 12]
    outer.right =      10

[workspace-to-monitor-force-assignment]
5 = 'built-in'
6 = 'built-in'
7 = 'built-in'
8 = 'built-in'

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # Meh reaches AeroSpace as ⌘⌥⇧ (firmware sends ⌥⇧⌃, then ⌃ is swapped to ⌘).
    # One Voyager key — hold it, tap a nav key. "Move" adds ⌃ (left pinky = n)
    # → full hyper ⌘⌥⇧⌃. ⌘⌥⇧ is super-meta-shift in Emacs (unbound); it shares
    # Tuna's ⌘⌥⇧ family, so the bound keys steer clear of Tuna's D/V/M/Space.

    # ── Focus (hold Meh, tap h/a/e/i)
    cmd-alt-shift-h = 'focus left --boundaries all-monitors-outer-frame'
    cmd-alt-shift-a = 'focus down'
    cmd-alt-shift-e = 'focus up'
    cmd-alt-shift-i = 'focus right --boundaries all-monitors-outer-frame'

    # ── Move window (Meh+Ctrl → add n)
    cmd-alt-shift-ctrl-h = 'move left --boundaries all-monitors-outer-frame'
    cmd-alt-shift-ctrl-a = 'move down'
    cmd-alt-shift-ctrl-e = 'move up'
    cmd-alt-shift-ctrl-i = 'move right --boundaries all-monitors-outer-frame'

    # ── Jump to previously focused window, across workspaces (⌘`)
    cmd-backtick = 'exec-and-forget ~/.config/aerospace/scripts/focus-prev.sh'

    # ── Cycle workspaces (Meh ' = prev, Meh / = next; wraps at the ends)
    # Anchored to the focused *window's* monitor, not the monitor under the
    # mouse — AeroSpace's built-in `workspace next|prev` drifts to the last
    # clicked monitor. See scripts/workspace-cycle.sh.
    cmd-alt-shift-quote = 'exec-and-forget ~/.config/aerospace/scripts/workspace-cycle.sh prev'
    cmd-alt-shift-slash = 'exec-and-forget ~/.config/aerospace/scripts/workspace-cycle.sh next'

    # ── Send window to prev/next workspace + follow (Meh+Ctrl ' or /)
    # --no-stdin is required for next/prev since AeroSpace v0.20.0.
    cmd-alt-shift-ctrl-quote = 'move-node-to-workspace --wrap-around --no-stdin --focus-follows-window prev'
    cmd-alt-shift-ctrl-slash = 'move-node-to-workspace --wrap-around --no-stdin --focus-follows-window next'

    # ── Leader: enter the window menu, then press single keys (esc to exit).
    # Entering lights up the Sketchybar "WINDOW" badge.
    cmd-alt-shift-enter = ['mode window', 'exec-and-forget sketchybar --set window_mode drawing=on popup.drawing=on']

# 'window' binding mode — tap Meh+↩, then single keys. No held chords here.
# Every path back to main also hides the badge (drawing=off). Sticky actions
# (t/c/-/=) keep you in the mode, so the badge stays lit until you exit.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.window.binding]
    esc = ['mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']

    # Switch workspace — letters match the Sketchybar labels (H A E I F O U ;)
    h = ['workspace 1', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    a = ['workspace 2', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    e = ['workspace 3', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    i = ['workspace 4', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    f = ['workspace 5', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    o = ['workspace 6', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    u = ['workspace 7', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    semicolon = ['workspace 8', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']

    # Send focused window to workspace + follow it (⇧ + same letter)
    shift-h = ['move-node-to-workspace --focus-follows-window 1', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    shift-a = ['move-node-to-workspace --focus-follows-window 2', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    shift-e = ['move-node-to-workspace --focus-follows-window 3', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    shift-i = ['move-node-to-workspace --focus-follows-window 4', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    shift-f = ['move-node-to-workspace --focus-follows-window 5', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    shift-o = ['move-node-to-workspace --focus-follows-window 6', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    shift-u = ['move-node-to-workspace --focus-follows-window 7', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    shift-semicolon = ['move-node-to-workspace --focus-follows-window 8', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']

    # Layout
    t = 'layout tiles horizontal vertical'        # Tiles (stays in mode)
    c = 'layout accordion horizontal vertical'    # aCcordion (stays in mode)
    w = ['layout floating tiling', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']   # toggle float
    enter = ['fullscreen', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']           # Meh+↩ then ↩ = fullscreen

    # Sizing — no auto-return, so you can repeat: - - -  or  = = =
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    b = ['balance-sizes', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']

    # Merge with neighbour
    left  = ['join-with left',  'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    right = ['join-with right', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']

    # Fix-ups & monitors
    r = ['flatten-workspace-tree', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']            # reset tree
    backspace = ['close-all-windows-but-current', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    y = ['move-workspace-to-monitor --wrap-around next', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    tab = ['workspace-back-and-forth', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
    q = ['reload-config', 'mode main', 'exec-and-forget sketchybar --set window_mode drawing=off popup.drawing=off']
[[on-window-detected]]
    if.app-id = 'org.godotengine.godot'
    run = 'layout floating'

# Emacs / emacsclient (same bundle id) -> workspace 1
[[on-window-detected]]
    if.app-id = 'org.gnu.Emacs'
    run = 'move-node-to-workspace 1'

# Zen browser -> workspace 2
[[on-window-detected]]
    if.app-id = 'app.zen-browser.zen'
    run = 'move-node-to-workspace 2'
